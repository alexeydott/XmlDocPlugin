lp-modal{background:var(--bg);border-radius:8px;width:90%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px #0003}.help-modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}.help-modal-title{font-weight:700;font-size:14px}.help-modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);line-height:1;padding:0 4px}.help-modal-close:hover{color:var(--text)}.help-modal-body{overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}.help-tag-card{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}.help-tag-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}.help-tag-name{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--accent)}.help-tag-shortcut{font-family:var(--font-mono);font-size:10px;padding:1px 5px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:3px;color:var(--text-muted)}.help-tag-desc{font-size:12px;color:var(--text);margin-bottom:6px}.help-tag-example{background:var(--bg-secondary);border-radius:3px;padding:6px 8px;margin-bottom:6px;overflow-x:auto}.help-tag-example code{font-family:var(--font-mono);font-size:11px;color:var(--text);white-space:pre-wrap}.help-tag-usage{font-size:11px;color:var(--text-muted);font-style:italic}#workbench{flex:none;padding:6px 10px;border-bottom:1px solid var(--border-color,#bbb);max-height:45vh;overflow:auto}#workbench summary{cursor:pointer;font-weight:600}#edit-status{font-weight:400;font-size:12px;margin-left:10px}#source-access-status{padding:6px 10px;background:var(--accent-light);color:var(--text);border-bottom:1px solid var(--border)}.workbench-actions{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;align-items:center}.workbench-icon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 30px;width:30px;height:30px;padding:5px;border: ate{white-space:normal;overflow-wrap:anywhere}.workbench-icon[hidden]{display:none}</style>
</head>
<body>
  <!-- Formatting Toolbar -->
  <div id="doc-toolbar"></div>

  <!-- Design View -->
  <div id="doc-design">
    <!-- Member Signature Header -->
    <div id="member-signature">Place the cursor on a code element</div>

    <!-- Scrollable Document -->
    <div id="doc-content">
      <!-- Summary -->
      <div class="doc-section" id="summary-section">
        <h3 class="doc-heading" data-section="summary"><span class="collapse-icon">▼</span> Summary</h3>
        <div class="doc-section-body">
          <div class="doc-editor" id="summary-editor"></div>
        </div>
      </div>

      <!-- Syntax: Parameters -->
      <div class="doc-section hidden" id="params-section">
        <h3 class="doc-heading" data-section="params"><span class="collapse-icon">▼</span> Parameters</h3>
        <div class="doc-section-body">
          <table class="param-table">
            <thead><tr><th class="th-name">Parameter</th><th>Description</th></tr></thead>
            <tbody id="params-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Syntax: Type Parameters -->
      <div class="doc-section hidden" id="typeparams-section">
        <h3 class="doc-heading" data-section="typeparams"><span class="collapse-icon">▼</span> Type Parameters</h3>
        <div class="doc-section-body">
          <table class="param-table">
            <thead><tr><th class="th-name">Type Parameter</th><th>Description</th></tr></thead>
            <tbody id="typeparams-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Return Value -->
      <div class="doc-section hidden" id="returns-section">
        <h3 class="doc-heading" data-section="returns"><span class="collapse-icon">▼</span> Return Value</h3>
        <div class="doc-section-body">
          <div class="return-type" id="return-type"></div>
          <div class="doc-editor" id="returns-editor"></div>
        </div>
      </div>

      <!-- Value (Property) -->
      <div class="doc-section hidden" id="value-section">
        <h3 class="doc-heading" data-section="value"><span class="collapse-icon">▼</span> Value</h3>
        <div class="doc-section-body">
          <div class="doc-editor" id="value-editor"></div>
        </div>
      </div>

      <!-- Remarks -->
      <div class="doc-section" id="remarks-section">
        <h3 class="doc-heading" data-section="remarks"><span class="collapse-icon">▼</span> Remarks</h3>
        <div class="doc-section-body">
          <div class="doc-editor" id="remarks-editor"></div>
        </div>
      </div>

      <!-- Examples -->
      <div class="doc-section" id="examples-section">
        <h3 class="doc-heading" data-section="examples"><span class="collapse-icon">▼</span> Examples</h3>
        <div class="doc-section-body">
          <div id="examples-body"></div>
          <button id="btn-add-example" class="btn-add">+ Example</button>
        </div>
      </div>

      <!-- Exceptions -->
      <div class="doc-section" id="exceptions-section">
        <h3 class="doc-heading" data-section="exceptions"><span class="collapse-icon">▼</span> Exceptions</h3>
        <div class="doc-section-body">
          <div id="exceptions-body"></div>
          <button id="btn-add-exception" class="btn-add">+ Exception</button>
        </div>
      </div>

      <!-- See Also -->
      <div class="doc-section" id="seealso-section">
        <h3 class="doc-heading" data-section="seealso"><span class="collapse-icon">▼</span> See Also</h3>
        <div class="doc-section-body">
          <div id="seealso-body"></div>
          <button id="btn-add-seealso" class="btn-add">+ See Also</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview View -->
  <div id="doc-preview" class="hidden"></div>

  <!-- Bottom Tab Bar -->
  <div id="doc-tabs">
    <button class="tab active" data-tab="design">Design</button>
    <button class="tab" data-tab="preview">Preview</button>
  </div>

</body>
</html>
