  white-space: pre-wrap;
  white-space: break-spaces;
  -webkit-font-variant-ligatures: none;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0; /* the above doesn't seem to work in Edge */
}

.ProseMirror [contenteditable="false"] {
  white-space: normal;
}

.ProseMirror [contenteditable="false"] [contenteditable="true"] {
  white-space: pre-wrap;
}

.ProseMirror pre {
  white-space: pre-wrap;
}

img.ProseMirror-separator {
  display: inline !important;
  border: none !important;
  margin: 0 !important;
  width: 0 !important;
  height: 0 !important;
}

.ProseMirror-gapcursor {
  display: none;
  pointer-events: none;
  position: absolute;
  margin: 0;
}

.ProseMirror-gapcursor:after {
  content: "";
  display: block;
  position: absolute;
  top: -2px;
  width: 20px;
  border-top: 1px solid black;
  animation: ProseMirror-cursor-blink 1.1s steps(2, start) infinite;
}

@keyframes ProseMirror-cursor-blink {
  to {
    visibility: hidden;
  }
}

.ProseMirror-hideselection *::selection {
  background: transparent;
}

.ProseMirror-hideselection *::-moz-selection {
  background: transparent;
}

.ProseMirror-hideselection * {
  caret-color: transparent;
}

.ProseMirror-focused .ProseMirror-gapcursor {
  display: block;
}

  opacity: 0

<body>
  <!-- Formatting Toolbar -->
  <div id="doc-toolbar"></div>

  <!-- Design View -->
  <div id="doc-design">
    <!-- Member Signature Header -->
    <div id="member-signature" data-ui-placeholder>Place the cursor on a code element</div>

    <!-- Scrollable Document -->
    <div id="doc-content">
      <!-- Summary -->
      <div class="doc-section" id="summary-section">
        <h3 class="doc-heading" data-section="summary"><span class="collapse-icon">▼</span> Summary</h3>
        <div class="doc-section-body">
          <div class="doc-editor" id="summary-editor"></div>
        </div>
      </div>

      <!-- Syntax: Parameters -->
      <div class="doc-section hidden" id="params-section">
        <h3 class="doc-heading" data-section="params"><span class="collapse-icon">▼</span> Parameters</h3>
        <div class="doc-section-body">
          <table class="param-table">
            <thead><tr><th class="th-name">Parameter</th><th>Description</th></tr></thead>
            <tbody id="params-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Syntax: Type Parameters -->
      <div class="doc-section hidden" id="typeparams-section">
        <h3 class="doc-heading" data-section="typeparams"><span class="collapse-icon">▼</span> Type Parameters</h3>
        <div class="doc-section-body">
          <table class="param-table">
            <thead><tr><th class="th-name">Type Parameter</th><th>Description</th></tr></thead>
            <tbody id="typeparams-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Return Value -->
      <div class="doc-section hidden" id="returns-section">
        <h3 class="doc-heading" data-section="returns"><span class="collapse-icon">▼</span> Return Value</h3>
        <div class="doc-section-body">
          <div class="return-type" id="return-type"></div>
          <div class="doc-editor" id="returns-editor"></div>
        </div>
      </div>

      <!-- Value (Property) -->
      <div class="doc-section hidden" id="value-section">
        <h3 class="doc-heading" data-section="value"><span class="collapse-icon">▼</span> Value</h3>
        <div class="doc-section-body">
          <div class="doc-editor" id="value-editor"></div>
        </div>
      </div>

      <!-- Remarks -->
      <div class="doc-section" id="remarks-section">
        <h3 class="doc-heading" data-section="remarks"><span class="collapse-icon">▼</span> Remarks</h3>
        <div class="doc-section-body">
          <div class="doc-editor" id="remarks-editor"></div>
        </div>
      </div>

      <!-- Examples -->
      <div class="doc-section" id="examples-section">
        <h3 class="doc-heading" data-section="examples"><span class="collapse-icon">▼</span> Examples</h3>
        <div class="doc-section-body">
          <div id="examples-body"></div>
          <button id="btn-add-example" class="btn-add">+ Example</button>
        </div>
      </div>

      <!-- Exceptions -->
      <div class="doc-section" id="exceptions-section">
        <h3 class="doc-heading" data-section="exceptions"><span class="collapse-icon">▼</span> Exceptions</h3>
        <div class="doc-section-body">
          <div id="exceptions-body"></div>
          <button id="btn-add-exception" class="btn-add">+ Exception</button>
        </div>
      </div>

      <!-- See Also -->
      <div class="doc-section" id="seealso-section">
        <h3 class="doc-heading" data-section="seealso"><span class="collapse-icon">▼</span> See Also</h3>
        <div class="doc-section-body">
          <div id="seealso-body"></div>
          <button id="btn-add-seealso" class="btn-add">+ See Also</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview View -->
  <div id="doc-preview" class="hidden"></div>

  <!-- Bottom Tab Bar -->
  <div id="doc-tabs">
    <button class="tab active" data-tab="design">Design</button>
    <button class="tab" data-tab="preview">Preview</button>
  </div>

</body>
</html>
