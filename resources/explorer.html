-icon svg{display:block;flex:none;pointer-events:none}.workbench-icon:hover{background:var(--bg-hover)}.workbench-icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.workbench-icon[aria-pressed=true]{color:var(--accent);background:var(--accent-light);border-color:var(--accent)}.workbench-icon:disabled{opacity:.45;cursor:default}#workbench input,#workbench select,#workbench textarea{max-width:100%;min-width:0;box-sizing:border-box}#workbench textarea{width:100%;min-height:40px}#catalog-results{max-height:220px;overflow:auto}.catalog-row{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #aaa;padding:4px}.catalog-row span{width:100%;overflow-wrap:anywhere}#member-summaries label{display:flex;gap:6px;flex-wrap:wrap}#member-summaries label textarea{width:100%}.documentation-issue{display:flex;justify-content:space-between;gap:8px;align-items:center;overflow-wrap:anywhere}#doc-xml{flex:1;overflow:auto;padding:10px;min-height:0}#xml-source{width:100%;height:45vh;box-sizing:border-box;white-space:pre;font-family:Consolas,monospace}.xml-diff{display:grid;grid-template-columns:1fr 1fr;gap:8px}.xml-diff pre{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;max-height:200px;overflow:auto}.opaque-xml{background:#e9c785;color:#222;padding:1px 4px;border-radius:3px}body.compact .doc-section{margin-bottom:2px}body.compact .doc-heading{padding:3px}body.compact #workbench{max-height:24vh}.seealso-row{flex-wrap:wrap}.seealso-description,.example-title{width:100%;min-width:0}@media(max-width:520px){.xml-diff{grid-template-columns:1fr}}body{display:block;overflow:hidden}#explorer-container{display:flex;width:100%;height:100vh;overflow:hidden}#tree-panel{width:260px;min-width:150px;max-width:50%;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--border);flex-shrink:0}#tree-header{display:flex;align-items:center;height:33px;box-sizing:border-box;padding:0 8px 0 12px;font-size:12px;font-weight:700;color:var(--text);background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;white-space:nowrap;overflow:hidden}#tree-header-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}#tree-header-actions{display:flex;gap:2px;flex-shrink:0}.tree-header-btn{width:22px;height:22px;padding:0;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--text-muted);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}.tree-header-btn:hover{background:var(--bg-hover);border-color:var(--border);color:var(--text)}#tree-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0}#explorer-splitter{width:4px;background:var(--border);cursor:col-resize;flex-shrink:0}#explorer-splitter:hover{background:var(--accent)}#editor-panel{flex:1;display:flex;flex-direction:column;min-width:300px;overflow:hidden}#explorer-container #doc-toolbar{height:33px;box-sizing:border-box;position:relative}.tree-empty{padding:16px;color:var(--text-muted);font-size:12px;text-align:center}.tree-root{list-style:none;padding:0;margin:0}.tree-children{list-style:none;padding:0 0 0 12px;margin:0}.tree-node{margin:0}.tree-row{display:flex;align-items:center;gap:2px;padding:2px 8px 2px 4px;cursor:pointer;white-space:nowrap;font-size:12px;border-radius:2px}.tree-row:hover{background:var(--bg-hover)}.tree-row.tree-selected{background:var(--accent-light);color:var(--accent)}.tree-arrow{width:14px;text-align:center;font-size:10px;color:var(--text-muted);flex-shrink:0;user-select:none}.tree-arrow-active{cursor:pointer}.tree-arrow-active:hover{color:var(--text)}.tree-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:10px;font-weight:700;border-radius:3px;flex-shrink:0;color:#fff;background:var(--text-muted)}.tree-icon-class{background:#0b7285}.tree-icon-record{background:#5c940d}.tree-icon-intf{background:#862e9c}.tree-icon-method{background:#d9480f}.tree-icon-prop{background:#5f3dc4}.tree-icon-field{background:#2b8a3e}.tree-icon-const{background:#e67700}.tree-icon-type{background:#364fc7}.tree-icon-unit{background:#495057}.tree-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.tree-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:4px}.tree-dot-ok{background:#51cf66}.tree-dot-none{background:#ced4da}.tree-context-menu{position:fixed;z-index:1000;min-width:140px;padding:4px 0;background:var(--bg);border:1px solid var(--border);border-radius:4px;box-shadow:0 2px 8px #00000026;font-size:12px}.tree-context-item{padding:5px 12px;cursor:pointer;color:var(--text);white-space:nowrap}.tree-context-item:hover{background:var(--accent-light);color:var(--accent)}</style>
</head>
<body>
  <div id="explorer-container">
    <!-- Tree Panel -->
    <div id="tree-panel">
      <div id="tree-header">
        <span id="tree-header-title">Documentation Explorer</span>
        <span id="tree-header-actions">
          <button id="btn-expand-all" class="tree-header-btn" title="Expand All">&#x25BC;</button>
          <button id="btn-collapse-all" class="tree-header-btn" title="Collapse All">&#x25B6;</button>
        </span>
      </div>
      <div id="tree-content"></div>
    </div>

    <!-- Splitter -->
    <div id="explorer-splitter"></div>

    <!-- Editor Panel -->
    <div id="editor-panel">
      <!-- Formatting Toolbar -->
      <div id="doc-toolbar"></div>

      <!-- Design View -->
      <div id="doc-design">
        <!-- Member Signature Header -->
        <div id="member-signature">Select an element from the tree</div>

        <!-- Scrollable Document -->
        <div id="doc-content">
          <!-- Summary -->
          <div class="doc-section" id="summary-section">
            <h3 class="doc-heading" data-section="summary"><span class="collapse-icon">&#x25BC;</span> Summary</h3>
            <div class="doc-section-body">
              <div class="doc-editor" id="summary-editor"></div>
            </div>
          </div>

          <!-- Syntax: Parameters -->
          <div class="doc-section hidden" id="params-section">
            <h3 class="doc-heading" data-section="params"><span class="collapse-icon">&#x25BC;</span> Parameters</h3>
            <div class="doc-section-body">
              <table class="param-table">
                <thead><tr><th class="th-name">Parameter</th><th>Description</th></tr></thead>
                <tbody id="params-body"></tbody>
              </table>
            </div>
          </div>

          <!-- Syntax: Type Parameters -->
          <div class="doc-section hidden" id="typeparams-section">
            <h3 class="doc-heading" data-section="typeparams"><span class="collapse-icon">&#x25BC;</span> Type Parameters</h3>
            <div class="doc-section-body">
              <table class="param-table">
                <thead><tr><th class="th-name">Type Parameter</th><th>Description</th></tr></thead>
                <tbody id="typeparams-body"></tbody>
              </table>
            </div>
          </div>

          <!-- Return Value -->
          <div class="doc-section hidden" id="returns-section">
            <h3 class="doc-heading" data-section="returns"><span class="collapse-icon">&#x25BC;</span> Return Value</h3>
            <div class="doc-section-body">
              <div class="return-type" id="return-type"></div>
              <div class="doc-editor" id="returns-editor"></div>
            </div>
          </div>

          <!-- Value (Property) -->
          <div class="doc-section hidden" id="value-section">
            <h3 class="doc-heading" data-section="value"><span class="collapse-icon">&#x25BC;</span> Value</h3>
            <div class="doc-section-body">
              <div class="doc-editor" id="value-editor"></div>
            </div>
          </div>

          <!-- Remarks -->
          <div class="doc-section" id="remarks-section">
            <h3 class="doc-heading" data-section="remarks"><span class="collapse-icon">&#x25BC;</span> Remarks</h3>
            <div class="doc-section-body">
              <div class="doc-editor" id="remarks-editor"></div>
            </div>
          </div>

          <!-- Examples -->
          <div class="doc-section" id="examples-section">
            <h3 class="doc-heading" data-section="examples"><span class="collapse-icon">&#x25BC;</span> Examples</h3>
            <div class="doc-section-body">
              <div id="examples-body"></div>
              <button id="btn-add-example" class="btn-add">+ Example</button>
            </div>
          </div>

          <!-- Exceptions -->
          <div class="doc-section" id="exceptions-section">
            <h3 class="doc-heading" data-section="exceptions"><span class="collapse-icon">&#x25BC;</span> Exceptions</h3>
            <div class="doc-section-body">
              <div id="exceptions-body"></div>
              <button id="btn-add-exception" class="btn-add">+ Exception</button>
            </div>
          </div>

          <!-- See Also -->
          <div class="doc-section" id="seealso-section">
            <h3 class="doc-heading" data-section="seealso"><span class="collapse-icon">&#x25BC;</span> See Also</h3>
            <div class="doc-section-body">
              <div id="seealso-body"></div>
              <button id="btn-add-seealso" class="btn-add">+ See Also</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Preview View -->
      <div id="doc-preview" class="hidden"></div>

      <!-- Bottom Tab Bar -->
      <div id="doc-tabs">
        <button class="tab active" data-tab="design">Design</button>
        <button class="tab" data-tab="preview">Preview</button>
      </div>
    </div>
  </div>

</body>
</html>
